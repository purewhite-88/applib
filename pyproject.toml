[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "applib-ui"
version = "0.0.1"
description = "Android / iOS 通用 UI 自动化测试框架"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3", "Framework :: Pytest"]
dependencies = [
  "click==8.1.7",
  "loguru==0.7.0",
  "PyYAML>=6.0.2,<7",
  "allure-pytest>=2.13.5,<3",
  "pytest>=8.2,<10"
]

[project.optional-dependencies]
android = [
  "uiautomator2==3.2.4",
]
ios = [
  "tidevice==0.12.10",
  "facebook-wda==1.5.0"
]
image = ["numpy>=1.26,<3", "opencv-python>=4.8,<5"]
ocr = [
  "requests>=2.28,<3",
  "natocr==2.3.0"
]

[project.urls]
Repository = "https://github.com/purewhite-88/applib"

[project.scripts]
applib-ui = "applib_ui.cli:main"

[project.entry-points.pytest11]
applib-ui = "applib_ui.pytest_plugin"

[tool.setuptools.packages.find]
include = ["applib_ui*"]

[tool.setuptools.package-data]
applib_ui = ["running/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
